<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central Lab Digital Twin</title>
    <script>
      // Safely redirect to subfolder root without escaping to domain root
      const segments = window.location.pathname.split('/').filter(Boolean);
      const basePath = segments.length > 0 ? '/' + segments[0] + '/' : '/';
      window.location.replace(basePath);
    </script>
  </head>
  <body>
    <p>กำลังนำท่านกลับสู่หน้าหลัก <a href="./">คลิกที่นี่หากไม่เปลี่ยนหน้าโดยอัตโนมัติ</a></p>
  </body>
</html>
